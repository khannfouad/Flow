version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: flow_postgres
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: apache/kafka:3.7.1
    container_name: flow_kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --list --bootstrap-server localhost:9092",
        ]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:3.7.1
    container_name: flow_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "/opt/kafka/bin/kafka-topics.sh --create --if-not-exists
      --topic flow-events
      --bootstrap-server kafka:9092
      --partitions 1
      --replication-factor 1"

  migrate:
    build:
      context: .
      dockerfile: apps/entry_backend/Dockerfile
    container_name: flow_migrate
    command:
      [
        "sh",
        "-c",
        "cd /app/packages/db && npx prisma migrate deploy --config prisma.config.ts",
      ]
    environment:
      DATABASE_URL: postgresql://myuser:mypassword@postgres:5432/mydatabase?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: apps/entry_backend/Dockerfile
    container_name: flow_seed
    command:
      [
        "sh",
        "-c",
        "cd /app/packages/db && npx prisma db seed --config prisma.config.ts",
      ]
    environment:
      DATABASE_URL: postgresql://myuser:mypassword@postgres:5432/mydatabase?schema=public
    depends_on:
      migrate:
        condition: service_completed_successfully

  entry_backend:
    build:
      context: .
      dockerfile: apps/entry_backend/Dockerfile
    container_name: flow_entry_backend
    restart: always
    ports:
      - "4200:4200"
    environment:
      DATABASE_URL: postgresql://myuser:mypassword@postgres:5432/mydatabase?schema=public
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  hooks:
    build:
      context: .
      dockerfile: apps/hooks/Dockerfile
    container_name: flow_hooks
    restart: always
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgresql://myuser:mypassword@postgres:5432/mydatabase?schema=public
    depends_on:
      seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  processor:
    build:
      context: .
      dockerfile: apps/processor/Dockerfile
    container_name: flow_processor
    restart: always
    environment:
      DATABASE_URL: postgresql://myuser:mypassword@postgres:5432/mydatabase?schema=public
      KAFKA_BROKER: kafka:9092
    depends_on:
      seed:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  workers:
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    container_name: flow_workers
    restart: always
    environment:
      DATABASE_URL: postgresql://myuser:mypassword@postgres:5432/mydatabase?schema=public
      KAFKA_BROKER: kafka:9092
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: codeclass255@gmail.com
      SMTP_PASS: czsmbzhsktjmwktc
      SMTP_FROM: codeclass255@gmail.com
    depends_on:
      seed:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: apps/scheduler/Dockerfile
    container_name: flow_scheduler
    restart: always
    environment:
      DATABASE_URL: postgresql://myuser:mypassword@postgres:5432/mydatabase?schema=public
    depends_on:
      seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  kafka_data:
